name: Mesa Panfrost for iOS (S10)

# First step of the S10 GPU composition work: cross-compile Mesa's Panfrost
# (Mali-G76, Bifrost v7) for iOS arm64e and keep the logs, to see what the port
# needs. Mesa is MIT-licensed and fetched from its release archive; no Apple
# payload is read or published.

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: Mesa release from archive.mesa3d.org
        default: '25.0.7'
  push:
    branches: [s10-gpu]
    paths:
      - scripts/mesa/**
      - .github/workflows/mesa-panfrost.yml

permissions:
  contents: read

jobs:
  panfrost-ios:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch Mesa
        shell: bash
        env:
          MESA_VERSION: ${{ inputs.mesa_version || '25.0.7' }}
        run: |
          set -euo pipefail
          [[ "$MESA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'bad version'; exit 1; }
          mkdir -p out/mesa
          curl -fsSL -o out/mesa/mesa.tar.xz "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"
          shasum -a 256 out/mesa/mesa.tar.xz | tee out/mesa/mesa.sha256
          tar -xf out/mesa/mesa.tar.xz -C out/mesa
      - name: Build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv out/mesa/venv
          out/mesa/venv/bin/pip install --quiet meson mako pyyaml packaging
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja bison flex || true
      - name: Configure and build Panfrost for iOS arm64e
        shell: bash
        env:
          MESA_VERSION: ${{ inputs.mesa_version || '25.0.7' }}
        run: |
          set -uo pipefail
          export PATH="$PWD/out/mesa/venv/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          bash scripts/mesa/build-panfrost-ios.sh "out/mesa/mesa-${MESA_VERSION}" out/mesa/ios || true
          echo '--- configure tail'; tail -60 out/mesa/ios/configure.log || true
          echo '--- first errors'; grep -n 'error:' out/mesa/ios/build.log | head -80 || true
          echo '--- b2l-drm'; cat out/mesa/ios/b2l-drm.log || true
          echo '--- b2l-mesa'; cat out/mesa/ios/b2l-mesa.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mesa-panfrost-ios-logs
          path: |
            out/mesa/mesa.sha256
            out/mesa/ios/*.log
            out/mesa/ios/ios-arm64e.txt
          if-no-files-found: warn
      # Our code and Mesa (MIT) only, built against the public iOS SDK.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b2l-mesa
          path: out/mesa/ios/b2l-mesa/libb2l-mesa.dylib
          if-no-files-found: warn
